<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="110" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="6"/>

  <!-- Subtle Perspective Grid -->
  <g stroke="#334155" stroke-width="1.5" opacity="0.3">
    <line x1="64" y1="400" x2="448" y2="400"/>
    <line x1="96" y1="430" x2="416" y2="430"/>
    <line x1="128" y1="460" x2="384" y2="460"/>
    <line x1="256" y1="360" x2="64" y2="460"/>
    <line x1="256" y1="360" x2="448" y2="460"/>
    <line x1="256" y1="360" x2="256" y2="480"/>
  </g>

  <!-- Morphing Fold Polyhedron Motif -->
  <!-- Flat Net Ghost Outline -->
  <g stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 6" fill="none" opacity="0.45">
    <!-- Center Base -->
    <polygon points="256,290 330,332 256,375 182,332"/>
    <!-- Unfolded East Flap -->
    <polygon points="330,332 404,374 330,416 256,375"/>
    <!-- Unfolded West Flap -->
    <polygon points="182,332 256,375 182,416 108,374"/>
  </g>

  <!-- 3D Rising Polyhedron Faces (Folded) -->
  <g filter="url(#glow)">
    <!-- Top Face / Apex -->
    <polygon points="256,120 340,168 256,216 172,168" fill="url(#cyan-glow)" fill-opacity="0.88" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/>
    
    <!-- Left Front Face -->
    <polygon points="172,168 256,216 256,312 172,264" fill="url(#purple-glow)" fill-opacity="0.85" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Right Front Face -->
    <polygon points="256,216 340,168 340,264 256,312" fill="url(#emerald-glow)" fill-opacity="0.88" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Folding Wing (Semi-Unfolded) -->
    <polygon points="340,168 420,135 420,231 340,264" fill="url(#amber-glow)" fill-opacity="0.8" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Projection Rays from Vertices -->
  <g stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.75">
    <line x1="256" y1="120" x2="256" y2="60"/>
    <line x1="340" y1="168" x2="430" y2="168"/>
    <line x1="172" y1="168" x2="82" y2="168"/>
  </g>

  <!-- Plan / Elevation Indicator Marks -->
  <circle cx="256" cy="60" r="5" fill="#38bdf8"/>
  <circle cx="430" cy="168" r="5" fill="#34d399"/>
  <circle cx="82" cy="168" r="5" fill="#a855f7"/>

  <!-- Badge Typography -->
  <text x="256" y="445" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="800" font-size="28" fill="#f8fafc" text-anchor="middle" letter-spacing="4">SHAPEMORPH 3D</text>
  <text x="256" y="475" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="600" font-size="14" fill="#38bdf8" text-anchor="middle" letter-spacing="2">NETS &amp; ELEVATIONS LAB</text>
</svg>
